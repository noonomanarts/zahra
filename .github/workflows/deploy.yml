name: Deploy Zahra
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zahra-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate configuration and package tracked code only
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_HOST_FINGERPRINT; do
            test -n "${!name}" || { echo "Missing required secret: $name"; exit 1; }
          done
          python3 - <<'PY'
          import re, subprocess
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          forbidden = [p for p in paths if p and (
            p.startswith(('storage/', 'backups/', 'private-migration/')) or
            re.search(r'(^|/)(\.env($|\.)|runtime\.env$)', p) and not p.endswith('.example') or
            re.search(r'\.(db|sqlite|sqlite3|pem|key)(-|$)', p))]
          if forbidden:
              raise SystemExit('Refusing publication package: private file paths are tracked')
          PY
          git archive --format=tar.gz --output=deploy-source.tar.gz HEAD
      - name: Transfer source archive
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || '22' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: deploy-source.tar.gz
          target: /root/zahra/incoming/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build and deploy isolated Zahra release
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || '22' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          command_timeout: 35m
          script: |
            set -eu
            umask 077
            base=/root/zahra
            release="$base/releases/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            test -s "$base/shared/storage/zahra.db"
            mkdir "$release"
            tar -xzf "$base/incoming/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/deploy-source.tar.gz" -C "$release"
            cd "$release"
            bash deploy/release.sh '${{ github.sha }}'
